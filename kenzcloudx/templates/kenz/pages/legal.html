{% include "templates/kenz/pages/_page_hero.html" %}

<section class="section wrap legal-section">
	<div class="legal-card glass reveal">
		{%- for s in t.sections %}
		<section class="legal-sec" aria-labelledby="legal-{{ loop.index|e }}">
			<span class="mini-num" dir="ltr" aria-hidden="true">{{ ("%02d" % loop.index)|e }}</span>
			<div>
				<h2 id="legal-{{ loop.index|e }}">{{ s.heading|e }}</h2>
				<p>{{ s.body|e }}</p>
			</div>
		</section>
		{%- endfor %}
	</div>
</section>
